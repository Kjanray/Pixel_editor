<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Matrix Pixel Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #08090c; --panel: #0e1014; --border: #1a1d24;
    --text: #8a9bb0; --text-dim: #4a5568; --accent: #50a060;
    --accent-dim: #2a5030; --danger: #c04040;
  }
  body { background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12px; min-height:100vh; }
  .app { max-width:1100px; margin:0 auto; padding:16px; }
  .header { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .header h1 { font-size:14px; font-weight:700; letter-spacing:2px; color:var(--accent); }
  .header .subtitle { font-size:9px; color:var(--text-dim); letter-spacing:1px; }
  .main { display:flex; gap:16px; flex-wrap:wrap; }
  .canvas-col { flex-shrink:0; }
  .side-col { flex:1; min-width:220px; max-width:320px; display:flex; flex-direction:column; gap:10px; }
  .right-col { flex:1; min-width:260px; display:flex; flex-direction:column; gap:10px; }

  /* Tabs */
  .tabs { display:flex; gap:0; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:8px 12px; background:transparent; border:1px solid var(--border); color:var(--text-dim); cursor:pointer; font:inherit; font-size:10px; letter-spacing:1px; transition:all .15s; }
  .tab:hover { border-color:var(--text-dim); }
  .tab.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:700; border-bottom:2px solid var(--accent); }
  .tab .delete-tab { margin-left:6px; color:var(--danger); font-size:8px; opacity:0.6; }
  .tab .delete-tab:hover { opacity:1; }
  .add-tab { padding:8px 10px; background:transparent; border:1px dashed var(--border); color:var(--text-dim); cursor:pointer; font:inherit; font-size:12px; }
  .add-tab:hover { border-color:var(--accent); color:var(--accent); }

  /* Canvas */
  canvas { cursor:crosshair; border-radius:4px; border:1px solid var(--border); image-rendering:pixelated; }
  .canvas-info { display:flex; justify-content:space-between; margin-top:6px; font-size:9px; color:var(--text-dim); }

  /* Panels */
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:10px; }
  .panel-title { font-size:9px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:8px; font-weight:600; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:4px; }
  .color-preview { width:36px; height:36px; border-radius:4px; border:1px solid var(--border); flex-shrink:0; }
  .rgb-inputs { display:flex; flex-direction:column; gap:3px; }
  .rgb-row { display:flex; gap:4px; align-items:center; }
  .rgb-label { width:10px; font-size:9px; font-weight:700; }
  .rgb-label.r { color:#ff6666; }
  .rgb-label.g { color:#66ff66; }
  .rgb-label.b { color:#6688ff; }
  input[type=number] { width:48px; padding:3px 5px; background:var(--bg); border:1px solid var(--border); border-radius:3px; color:var(--text); font:inherit; font-size:11px; text-align:center; outline:none; }
  input[type=number]:focus { border-color:var(--accent); }
  input[type=text], select, textarea { padding:4px 6px; background:var(--bg); border:1px solid var(--border); border-radius:3px; color:var(--text); font:inherit; font-size:10px; outline:none; width:100%; }
  input[type=text]:focus, select:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:120px; font-size:8px; line-height:1.3; }

  /* Buttons */
  .btn { padding:6px 10px; border:1px solid var(--border); border-radius:3px; background:transparent; color:var(--text); cursor:pointer; font:inherit; font-size:10px; transition:all .15s; }
  .btn:hover { border-color:var(--text-dim); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:700; }
  .btn.primary:hover { background:var(--accent-dim); color:var(--accent); }
  .btn.highlight { border-color:var(--accent); color:var(--accent); }
  .btn.danger { border-color:var(--danger); color:var(--danger); }
  .btn:disabled { opacity:0.3; cursor:default; }
  .btn-row { display:flex; gap:4px; flex-wrap:wrap; }

  /* Pixel info */
  .pixel-info { font-size:10px; line-height:1.8; }
  .pixel-info .label { color:var(--accent); }

  /* Code area */
  .code-toggle { width:100%; padding:8px 10px; background:var(--panel); border:1px solid var(--border); border-radius:4px; color:var(--accent); cursor:pointer; font:inherit; font-size:10px; display:flex; justify-content:space-between; align-items:center; }
  .code-panel { background:#020202; border:1px solid var(--border); border-top:none; border-radius:0 0 4px 4px; padding:10px; max-height:300px; overflow:auto; }
  .code-panel pre { font-size:7px; line-height:1.25; color:var(--text-dim); white-space:pre-wrap; word-break:break-all; margin:0; }
  .code-toggle.open { border-radius:4px 4px 0 0; }

  /* Settings */
  .settings-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .settings-label { font-size:9px; color:var(--text-dim); min-width:80px; }

  .toast { position:fixed; top:16px; right:16px; padding:8px 16px; background:var(--accent); color:var(--bg); border-radius:4px; font-size:11px; font-weight:700; z-index:999; animation:fadeIn .2s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
</style>
</head>

let SZ = 32;
let profiles = {};
let profileOrder = [];
let active = '';
let settings = { colorOrder: 'grb', constPrefix: 'DISPLAY_', useReverse: true, gridSize: 32 };
let paintR = 0, paintG = 255, paintB = 0;
let isPainting = false;
let hoveredCell = null;
let selectedCell = null;
let history = [];

let showImport = false;
let toastTimer = null;

function init() {
  for (const [k, v] of Object.entries(DEFAULTS)) {
    profiles[k] = v.map(r => [...r]);
    profileOrder.push(k);
  }
  active = profileOrder[0];
  render();
}

function toast(msg) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast');
  if (el) el.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.id = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 1500);
}

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}
function rgbToHex(r,g,b) {
  const h = v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');
  return '#' + h(r) + h(g) + h(b);
}

function encodePixel(hex) {
  const {r,g,b} = hexToRgb(hex);
  const pad = v => v.toString(16).padStart(2,'0').toUpperCase();
  const o = settings.colorOrder;
  if (o === 'grb') return '24h' + pad(g) + pad(r) + pad(b);
  if (o === 'rgb') return '24h' + pad(r) + pad(g) + pad(b);
  if (o === 'bgr') return '24h' + pad(b) + pad(g) + pad(r);
  if (o === 'rbg') return '24h' + pad(r) + pad(b) + pad(g);
  if (o === 'brg') return '24h' + pad(b) + pad(r) + pad(g);
  if (o === 'gbr') return '24h' + pad(g) + pad(b) + pad(r);
  return '24h' + pad(g) + pad(r) + pad(b);
}

function decodePixel(encoded) {
  // Parse 24hXXYYZZ based on color order setting
  const val = encoded.replace(/^24h/i, '');
  if (val.length !== 6) return null;
  const c1 = parseInt(val.slice(0,2),16), c2 = parseInt(val.slice(2,4),16), c3 = parseInt(val.slice(4,6),16);
  const o = settings.colorOrder;
  let r,g,b;
  if (o === 'grb') { g=c1; r=c2; b=c3; }
  else if (o === 'rgb') { r=c1; g=c2; b=c3; }
  else if (o === 'bgr') { b=c1; g=c2; r=c3; }
  else if (o === 'rbg') { r=c1; b=c2; g=c3; }
  else if (o === 'brg') { b=c1; r=c2; g=c3; }
  else if (o === 'gbr') { g=c1; b=c2; r=c3; }
  else { g=c1; r=c2; b=c3; }
  return rgbToHex(r,g,b);
}

function toLucid(key) {
  const grid = profiles[key];
  const prefix = settings.constPrefix || 'DISPLAY_';
  const wrap = settings.useReverse;
  const lines = [];
  lines.push('    // ' + key + ' \u2014 direct 24-bit ' + settings.colorOrder.toUpperCase() + ' per pixel');
  lines.push('    const ' + prefix + key + (wrap ? ' = $reverse({' : ' = {'));
  for (let r = 0; r < SZ; r++) {
    const vals = grid[r].map(encodePixel).join(', ');
    lines.push('        ' + vals + (r < SZ-1 ? ',' : ' ') + '  // row ' + r);
  }
  lines.push(wrap ? '    })' : '    }');
  return lines.join('\n');
}

function parseLucid(text) {
  // Extract 24hXXYYZZ values, 32 per row, 32 rows
  const vals = text.match(/24h[0-9A-Fa-f]{6}/g);
  if (!vals || vals.length < SZ*SZ) { toast('Need ' + (SZ*SZ) + ' values for ' + SZ + '×' + SZ + ', got ' + (vals?vals.length:0)); return null; }
  const grid = [];
  for (let r = 0; r < SZ; r++) {
    const row = [];
    for (let c = 0; c < SZ; c++) {
      const hex = decodePixel(vals[r*SZ+c]);
      if (!hex) return null;
      row.push(hex);
    }
    grid.push(row);
  }
  return grid;
}

function paintCell(r,c) {
  const color = rgbToHex(paintR, paintG, paintB);
  history.push({ key: active, r, c, prev: profiles[active][r][c] });
  profiles[active][r][c] = color;
}

function undo() {
  if (!history.length) return;
  const h = history.pop();
  if (profiles[h.key]) profiles[h.key][h.r][h.c] = h.prev;
  render();
}

function exportImage() {
  const cv = document.createElement('canvas');
  cv.width = SZ; cv.height = SZ;
  const ctx = cv.getContext('2d');
  const grid = profiles[active];
  for (let r=0;r<SZ;r++) for (let c=0;c<SZ;c++) {
    ctx.fillStyle = grid[r][c]; ctx.fillRect(c,r,1,1);
  }
  const big = document.createElement('canvas');
  const scale = Math.max(1, Math.floor(512/SZ));
  big.width = SZ * scale; big.height = SZ * scale;
  const bctx = big.getContext('2d');
  bctx.imageSmoothingEnabled = false;
  bctx.drawImage(cv, 0, 0, big.width, big.height);
  big.toBlob(function(blob) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = active.toLowerCase() + '_' + SZ + 'x' + SZ + '.png';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    toast('Exported ' + active + ' as PNG (' + big.width + 'x' + big.height + ')');
  }, 'image/png');
}

function saveSession() {
  const state = {
    version: 1,
    gridSize: SZ,
    settings: settings,
    profileOrder: profileOrder,
    profiles: profiles,
  };
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = 'led_editor_session.ledpx';
  link.href = url;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast('Session saved as .ledpx file');
}

function loadSession() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.ledpx,.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const state = JSON.parse(ev.target.result);
        if (!state.profiles || !state.profileOrder) throw new Error('Invalid format');
        // Restore
        SZ = state.gridSize || 32;
        settings = { ...settings, ...state.settings };
        settings.gridSize = SZ;
        profileOrder = state.profileOrder;
        profiles = {};
        for (const key of profileOrder) {
          if (state.profiles[key]) {
            profiles[key] = state.profiles[key].map(r => [...r]);
          }
        }
        active = profileOrder[0] || 'EASY';
        selectedCell = null;
        history = [];
        toast('Loaded session: ' + profileOrder.join(', '));
        render();
      } catch(err) {
        toast('Failed to load: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function addProfile() {
  const name = prompt('Profile name (uppercase, no spaces):');
  if (!name) return;
  const key = name.toUpperCase().replace(/[^A-Z0-9_]/g,'');
  if (!key || profiles[key]) { toast('Invalid or duplicate name'); return; }
  profiles[key] = Array.from({length:SZ}, () => Array.from({length:SZ}, () => '#000000'));
  profileOrder.push(key);
  active = key;
  history = [];
  toast('Created ' + key);
  render();
}

function deleteProfile(key) {
  if (profileOrder.length <= 1) { toast('Need at least one profile'); return; }
  if (!confirm('Delete ' + key + '?')) return;
  delete profiles[key];
  profileOrder = profileOrder.filter(k => k !== key);
  if (active === key) active = profileOrder[0];
  history = history.filter(h => h.key !== key);
  toast('Deleted ' + key);
  render();
}


function resizeGrid(newSize) {
  newSize = Math.max(4, Math.min(256, parseInt(newSize) || 32));
  if (newSize === SZ) return;
  const oldSZ = SZ;
  SZ = newSize;
  settings.gridSize = newSize;
  // Resize all profiles
  for (const key of profileOrder) {
    const oldGrid = profiles[key];
    const newGrid = [];
    for (let r = 0; r < SZ; r++) {
      const row = [];
      for (let c = 0; c < SZ; c++) {
        if (r < oldGrid.length && c < oldGrid[0].length) {
          row.push(oldGrid[r][c]);
        } else {
          row.push('#000000');
        }
      }
      newGrid.push(row);
    }
    profiles[key] = newGrid;
  }
  // Resize defaults too for reset
  for (const key of Object.keys(DEFAULTS)) {
    const oldGrid = DEFAULTS[key];
    const newGrid = [];
    for (let r = 0; r < SZ; r++) {
      const row = [];
      for (let c = 0; c < SZ; c++) {
        if (r < oldGrid.length && c < oldGrid[0].length) {
          row.push(oldGrid[r][c]);
        } else {
          row.push('#000000');
        }
      }
      newGrid.push(row);
    }
    DEFAULTS[key] = newGrid;
  }
  selectedCell = null;
  history = [];
  toast('Resized to ' + SZ + '×' + SZ);
  render();
}

function render() {
  const grid = profiles[active];
  const cellSize = Math.max(4, Math.min(16, Math.floor(448 / SZ)));
  const canvasSize = SZ * cellSize;
  const paintColor = rgbToHex(paintR, paintG, paintB);
  const cellInfo = selectedCell ? hexToRgb(grid[selectedCell.r][selectedCell.c]) : null;
  const cellEncoded = selectedCell ? encodePixel(grid[selectedCell.r][selectedCell.c]) : null;

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div><h1>LED MATRIX PIXEL EDITOR</h1><div class="subtitle">${SZ}×${SZ} · WS2812B · DIRECT COLOR</div></div>
      <div class="btn-row">
        <button class="btn" onclick="loadSession()">📂 Load</button>
        <button class="btn highlight" onclick="saveSession()">💾 Save</button>
        <button class="btn" onclick="toggleSettings()">⚙ Settings</button>
      </div>
    </div>

    <div id="settings-panel" style="display:none; margin-bottom:12px;" class="panel">
      <div class="panel-title">SETTINGS</div>
      <div class="settings-row">
        <span class="settings-label">Grid Size</span>
        <input type="number" id="gridSizeInput" min="4" max="256" value="${SZ}" style="width:52px;"
          onchange="resizeGrid(this.value)" />
        <span style="font-size:9px;color:var(--text-dim);">× ${SZ}px (4–256)</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Color Order</span>
        <select id="colorOrder" onchange="settings.colorOrder=this.value; render();">
          ${['grb','rgb','bgr','rbg','brg','gbr'].map(o => `<option value="${o}" ${settings.colorOrder===o?'selected':''}>${o.toUpperCase()}</option>`).join('')}
        </select>
      </div>
      <div class="settings-row">
        <span class="settings-label">Const Prefix</span>
        <input type="text" id="constPrefix" value="${settings.constPrefix}" onchange="settings.constPrefix=this.value; render();" />
      </div>
      <div class="settings-row">
        <span class="settings-label">$reverse()</span>
        <label><input type="checkbox" ${settings.useReverse?'checked':''} onchange="settings.useReverse=this.checked; render();" /> Wrap in $reverse()</label>
      </div>
    </div>

    <div class="tabs">
      ${profileOrder.map(k => `
        <button class="tab ${k===active?'active':''}" onclick="active='${k}';selectedCell=null;history=[];render();">
          ${k}${profileOrder.length > 1 ? `<span class="delete-tab" onclick="event.stopPropagation();deleteProfile('${k}')">✕</span>` : ''}
        </button>
      `).join('')}
      <button class="add-tab" onclick="addProfile()">+ New</button>
    </div>

    <div class="main">
      <div class="canvas-col">
        <canvas id="cv" width="${canvasSize}" height="${canvasSize}"></canvas>
        <div class="canvas-info">
          <span>${active}</span>
          <span id="hover-info">&nbsp;</span>
        </div>
      </div>

      <div class="side-col">
        <div class="panel">
          <div class="panel-title">PAINT COLOR</div>
          <div class="row">
            <div class="color-preview" style="background:${paintColor}"></div>
            <div class="rgb-inputs">
              <div class="rgb-row"><span class="rgb-label r">R</span><input type="number" min="0" max="255" value="${paintR}" id="inR"></div>
              <div class="rgb-row"><span class="rgb-label g">G</span><input type="number" min="0" max="255" value="${paintG}" id="inG"></div>
              <div class="rgb-row"><span class="rgb-label b">B</span><input type="number" min="0" max="255" value="${paintB}" id="inB"></div>
            </div>
          </div>
          <button class="btn primary" style="width:100%;margin-top:6px;" ${!selectedCell?'disabled':''} onclick="if(selectedCell){paintCell(selectedCell.r,selectedCell.c);render();}">
            PAINT [${selectedCell?selectedCell.r+','+selectedCell.c:'-'}]
          </button>
        </div>

        <div class="panel">
          <div class="panel-title">SELECTED PIXEL</div>
          ${selectedCell ? `<div class="pixel-info">
            <span class="label">pos</span> [${selectedCell.r}, ${selectedCell.c}]<br>
            <span class="label">rgb</span> (${cellInfo.r}, ${cellInfo.g}, ${cellInfo.b})<br>
            <span class="label">hex</span> ${grid[selectedCell.r][selectedCell.c]}<br>
            <span class="label">${settings.colorOrder}</span> ${cellEncoded}
          </div>` : `<div style="color:var(--text-dim);font-size:10px;">Click a pixel to select</div>`}
        </div>

        <div class="panel">
          <div class="panel-title">TOOLS</div>
          <div class="btn-row">
            <button class="btn" ${!history.length?'disabled':''} onclick="undo()">Undo</button>
            <button class="btn danger" onclick="if(confirm('Reset to default?')){if(DEFAULTS[active]){profiles[active]=DEFAULTS[active].map(r=>[...r])}else{profiles[active]=Array.from({length:SZ},()=>Array.from({length:SZ},()=>'#000000'))}history=[];render();}">Reset</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">EXPORT</div>
          <div class="btn-row" style="flex-direction:column;gap:4px;">
            <button class="btn highlight" onclick="copyCode('${active}')"}>Copy ${active}</button>
            <button class="btn highlight" onclick="copyCode('all')">Copy All</button>
            <button class="btn" onclick="exportImage()">Export PNG</button>
          </div>
          <div class="panel-title" style="margin-top:10px;">SESSION</div>
          <div class="btn-row" style="flex-direction:column;gap:4px;">
            <button class="btn highlight" onclick="saveSession()">💾 Save Session (.ledpx)</button>
            <button class="btn" onclick="loadSession()">📂 Load Session (.ledpx)</button>
          </div>
        </div>
      </div>

      <div class="right-col">
        <div>
          <button class="code-toggle ${showCode?'open':''}" onclick="showCode=!showCode;render();">
            <span>${settings.constPrefix}${active} — Lucid V2</span>
            <span>${showCode?'▲':'▼'}</span>
          </button>
          ${showCode ? `<div class="code-panel"><pre id="codeOutput">${escapeHtml(toLucid(active))}</pre></div>` : ''}
        </div>

        <div class="panel">
          <div class="panel-title">IMPORT LUCID CODE → PIXELS</div>
          <textarea id="importArea" placeholder="Paste Lucid code with 24hXXYYZZ values here...&#10;Must contain ${SZ*SZ} (${SZ}×${SZ}) values.&#10;Color order from settings (${settings.colorOrder.toUpperCase()}) will be used to decode."></textarea>
          <button class="btn primary" style="width:100%;margin-top:6px;" onclick="importLucid()">Import to ${active}</button>
        </div>
      </div>
    </div>
  `;

  // Setup canvas
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  drawCanvas(ctx, grid, cellSize, canvasSize);

  // RGB input listeners
  document.getElementById('inR').addEventListener('input', e => { paintR = clamp(parseInt(e.target.value)||0); });
  document.getElementById('inG').addEventListener('input', e => { paintG = clamp(parseInt(e.target.value)||0); });
  document.getElementById('inB').addEventListener('input', e => { paintB = clamp(parseInt(e.target.value)||0); });

  // Canvas events
  cv.addEventListener('mousedown', e => {
    const cell = getCell(e, cv, cellSize, canvasSize);
    if (cell) {
      isPainting = true;
      selectedCell = cell;
      const rgb = hexToRgb(grid[cell.r][cell.c]);
      paintR = rgb.r; paintG = rgb.g; paintB = rgb.b;
      render();
    }
  });
  cv.addEventListener('mousemove', e => {
    const cell = getCell(e, cv, cellSize, canvasSize);
    const info = document.getElementById('hover-info');
    if (cell && info) info.textContent = `[${cell.r},${cell.c}]`;
    if (isPainting && cell) {
      paintCell(cell.r, cell.c);
      drawCanvas(ctx, profiles[active], cellSize, canvasSize);
    }
  });
  cv.addEventListener('mouseup', () => { isPainting = false; });
  cv.addEventListener('mouseleave', () => { isPainting = false; });
}

function drawCanvas(ctx, grid, cellSize, canvasSize) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvasSize, canvasSize);
  for (let r = 0; r < SZ; r++) {
    for (let c = 0; c < SZ; c++) {
      ctx.fillStyle = grid[r][c];
      ctx.fillRect(c*cellSize, r*cellSize, cellSize-1, cellSize-1);
    }
  }
  if (selectedCell) {
    ctx.strokeStyle = '#50a060';
    ctx.lineWidth = 2;
    ctx.strokeRect(selectedCell.c*cellSize-0.5, selectedCell.r*cellSize-0.5, cellSize+1, cellSize+1);
  }
}

function getCell(e, cv, cellSize, canvasSize) {
  const rect = cv.getBoundingClientRect();
  const scale = canvasSize / rect.width;
  const c = Math.floor((e.clientX - rect.left) * scale / cellSize);
  const r = Math.floor((e.clientY - rect.top) * scale / cellSize);
  if (r >= 0 && r < SZ && c >= 0 && c < SZ) return {r,c};
  return null;
}

function clamp(v) { return Math.max(0, Math.min(255, v)); }

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function copyCode(key) {
  const text = key === 'all' ? profileOrder.map(toLucid).join('\n\n') : toLucid(key);
  navigator.clipboard.writeText(text).then(() => toast('Copied ' + (key==='all'?'all profiles':key)));
}

function importLucid() {
  const area = document.getElementById('importArea');
  if (!area) return;
  const grid = parseLucid(area.value);
  if (!grid) { toast('Parse failed — need 1024 24hXXYYZZ values'); return; }
  profiles[active] = grid;
  history = [];
  toast('Imported to ' + active);
  render();
}

function toggleSettings() {
  const p = document.getElementById('settings-panel');
  if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

init();
</script>
</body>
</html>
